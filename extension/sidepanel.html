<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Code Agent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◮</span>
      <div class="brand-text">
        <h1>Local Code Agent</h1>
        <p>Browser research agent</p>
      </div>
    </div>
    <div class="conn success" id="conn">connected</div>
    <button id="newChatBtn" class="btn secondary icon" title="New chat" aria-label="New chat">＋</button>
    <button id="settingsBtn" class="btn secondary icon" title="Server settings" aria-label="Server settings" aria-expanded="false">⚙</button>
  </header>

  <div class="statusbar" role="status" aria-live="polite">
    <button type="button" class="status-chip model-chip" id="statusModel" title="Choose the model">…</button>
    <span class="status-chip gen" id="genStatus" data-state="idle">Ready</span>
    <span class="status-chip time" id="responseTime" title="Response time for the last run">—</span>
  </div>

  <!-- Settings live in collapsible sections so the conversation stays on top. -->
  <div class="controls" id="setupBlock">
    <details class="section collapse" id="modelSection">
      <summary>
        <span class="summary-title">Model</span>
        <span class="summary-value" id="modelSummary">loading…</span>
      </summary>
      <div class="section-body">
        <div class="model-row">
          <div class="select-wrapper">
            <select id="modelSelect" title="Ollama model">
              <option>Loading models…</option>
            </select>
          </div>
          <button id="refreshModels" class="btn secondary icon" title="Refresh models" aria-label="Refresh models">⟳</button>
        </div>
      </div>
    </details>

    <details class="section collapse" id="tabSection">
      <summary>
        <span class="summary-title">Context</span>
        <span class="summary-value" id="tabSummary">Waiting for browser tab</span>
      </summary>
      <div class="section-body">
        <div class="tab-profile" aria-live="polite">
          <img id="tabFavicon" class="tab-favicon hidden" alt="" />
          <span class="tab-badge">Active tab</span>
          <div class="tab-info">
            <div id="tabTitle" class="tab-title">Loading…</div>
            <div id="tabUrl" class="tab-url">Waiting for browser tab</div>
          </div>
        </div>
        <label class="checkbox">
          <input id="includeTab" type="checkbox" checked />
          Read active tab into context
        </label>
      </div>
    </details>

    <details class="section collapse" id="projectSection">
      <summary>
        <span class="summary-title">Project</span>
        <span class="summary-value" id="projectSummary">Not set</span>
      </summary>
      <div class="section-body">
        <div class="input-row">
          <input id="projectRoot" type="text" placeholder="C:\path\to\your\project" />
          <button id="setProject" class="btn secondary">Set</button>
        </div>
      </div>
    </details>

    <details class="section collapse" id="autoSection">
      <summary>
        <span class="summary-title">Automation</span>
        <span class="summary-value" id="autoSummary">off</span>
      </summary>
      <div class="section-body">
        <div class="control-group">
          <div class="auto-row">
            <label class="checkbox">
              <input id="autoSearch" type="checkbox" />
              Auto-search Google with my prompt
            </label>
            <label class="checkbox">
              <input id="findBestLink" type="checkbox" />
              Find best link
            </label>
            <label class="checkbox">
              <input id="autoPrompt" type="checkbox" checked />
              Auto-fill prompt with page context
            </label>
          </div>
        </div>
        <div class="control-group">
          <span class="label">Research</span>
          <select id="researchMode">
            <option value="full">Full page research</option>
            <option value="summary">Summary only</option>
            <option value="links">Find and follow links</option>
          </select>
        </div>
      </div>
    </details>

    <details class="section collapse" id="settingsPanel">
      <summary>
        <span class="summary-title">Server &amp; approvals</span>
        <span class="summary-value" id="serverSummary">127.0.0.1:8787</span>
      </summary>
      <div class="section-body">
        <div class="control-group">
          <span class="label">Server URL</span>
          <div class="input-row">
            <input id="serverUrl" type="text" placeholder="http://127.0.0.1:8787" />
          </div>
        </div>
        <div class="control-group">
          <label class="checkbox">
            <input id="autoApprove" type="checkbox" />
            Auto-approve write &amp; run (unsafe)
          </label>
        </div>
      </div>
    </details>
  </div>

  <main id="messages" class="messages"></main>

  <div class="actionbar">
    <button id="stopBtn" class="btn danger action" title="Stop generating" disabled>■ Stop</button>
    <button id="regenBtn" class="btn secondary action" title="Regenerate the last answer" disabled>↻ Regenerate</button>
    <button id="copyBtn" class="btn secondary action" title="Copy the last answer" disabled>⧉ Copy</button>
    <button id="clearHistoryBtn" class="btn secondary danger action" title="Delete history">🗑 Clear</button>
  </div>

  <section id="approval" class="approval hidden">
    <div class="approval-text">
      <strong id="approvalName">run_command</strong>
      <pre id="approvalArgs"></pre>
    </div>
    <div class="approval-actions">
      <button id="approveBtn" class="btn primary" title="Allow this single call">Once</button>
      <button id="sessionBtn" class="btn primary approve-session" title="Allow for this session">Session</button>
      <button id="alwaysBtn" class="btn primary approve-always" title="Always allow (saved)">Always</button>
      <button id="denyBtn" class="btn danger" title="Deny">Deny</button>
    </div>
  </section>

  <footer class="composer">
    <textarea id="input" rows="1" placeholder="Ask anything…  ⏎ send"></textarea>
    <div class="composer-actions">
      <button id="send" class="send-btn">➤</button>
    </div>
  </footer>

  <script src="markdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
